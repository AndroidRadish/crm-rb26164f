services:
  db:
    image: postgres:16-alpine
    container_name: crm_rb26164f_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_rb26164f_pass_2026
      POSTGRES_DB: crm_rb26164f
    volumes:
      - crm_rb26164f_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: alpine:3.20
    container_name: crm_rb26164f_backend
    restart: unless-stopped
    ports:
      - "9092:9092"
    volumes:
      - ./bin/crm-rb26164f:/app/crm-rb26164f:ro
      - ./migrations:/app/migrations:ro
    environment:
      DATABASE_URL: postgres://crm:crm_rb26164f_pass_2026@db:5432/crm_rb26164f
      # 安全（C-P0-1）：生产密钥只从 deploy/.env（git 忽略，600）注入，仓内不留默认值。
      # 启动：docker compose -f deploy/server-docker-compose.yml --env-file deploy/.env up -d
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in deploy/.env (64 random chars)}
      RUST_LOG: info
      PORT: "9092"
      MIGRATIONS_DIR: /app/migrations
      # 工作室管理终端令牌：未配置则 owner 端点 fail-closed；生产值在服务器 compose 上覆写
      OWNER_TOKEN: ${OWNER_TOKEN:-}
    working_dir: /app
    command: sh -c "./crm-rb26164f"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: crm_rb26164f_frontend
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  crm_rb26164f_pgdata:
